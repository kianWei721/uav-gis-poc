<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>东明无人机 GIS Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet"
        href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 330px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      padding: 16px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
      color: #e2e8f0;
      backdrop-filter: blur(8px);
    }

    .panel-title {
      margin: 0;
      color: #f8fafc;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .panel-subtitle {
      margin: 5px 0 0;
      color: #94a3b8;
      font-size: 12px;
    }

    .section {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
    }

    .section-title {
      margin-bottom: 10px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    button {
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 6px;
      background: rgba(30, 41, 59, 0.88);
      color: #e2e8f0;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    button:hover:not(:disabled) {
      border-color: #38bdf8;
      color: #f8fafc;
    }

    button.active {
      border-color: #38bdf8;
      background: rgba(14, 165, 233, 0.22);
      color: #7dd3fc;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .back-link {
      display: block;
      margin-top: 8px;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 6px;
      background: rgba(14, 165, 233, 0.12);
      color: #bae6fd;
      font-size: 13px;
      line-height: 18px;
      text-align: center;
      text-decoration: none;
    }

    .back-link:hover {
      border-color: #38bdf8;
      color: #f8fafc;
    }

    .layer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 32px;
      gap: 12px;
      font-size: 13px;
    }

    .layer-row + .layer-row,
    .slider-control + .slider-control {
      margin-top: 6px;
    }

    .switch-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #0ea5e9;
    }

    .slider-control {
      margin-top: 10px;
    }

    .slider-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      color: #cbd5e1;
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #0ea5e9;
    }

    #status {
      margin-top: 14px;
      padding: 9px 10px;
      border-radius: 6px;
      background: rgba(34, 197, 94, 0.1);
      color: #86efac;
      font-size: 12px;
      line-height: 1.5;
    }

    #status.loading {
      background: rgba(56, 189, 248, 0.1);
      color: #7dd3fc;
    }

    #status.error {
      background: rgba(248, 113, 113, 0.1);
      color: #fca5a5;
    }

    #debugSection {
      color: #94a3b8;
      font-family: Consolas, monospace;
      font-size: 11px;
      line-height: 1.55;
      word-break: break-all;
    }

    #debugSection[hidden] {
      display: none;
    }

    @media (max-width: 640px) {
      #panel {
        top: 10px;
        left: 10px;
        width: calc(100vw - 20px);
        max-height: 48vh;
      }
    }
  </style>
</head>
<body>
<div id="cesiumContainer"></div>

<aside id="panel" aria-label="GIS Viewer 控制面板">
  <h1 class="panel-title">东明无人机 GIS</h1>
  <p class="panel-subtitle">正射影像与实景三维成果展示</p>

  <section class="section">
    <div class="section-title">视图模式</div>
    <div class="button-grid">
      <button id="orthoMode" type="button">正射模式</button>
      <button id="modelMode" type="button" disabled>三维模式</button>
    </div>
  </section>

  <section class="section">
    <div class="section-title">图层</div>
    <div class="layer-row">
      <label class="switch-label" for="orthoVisible">
        <input id="orthoVisible" type="checkbox">
        <span>正射影像</span>
      </label>
    </div>
    <div class="slider-control">
      <div class="slider-header">
        <label for="orthoAlpha">正射透明度</label>
        <span id="orthoAlphaValue">1.00</span>
      </div>
      <input id="orthoAlpha" type="range" min="0" max="1" step="0.05">
    </div>

    <div class="layer-row">
      <label class="switch-label" for="tilesVisible">
        <input id="tilesVisible" type="checkbox" disabled>
        <span>实景三维</span>
      </label>
    </div>
    <div class="slider-control">
      <div class="slider-header">
        <label for="tilesAlpha">模型透明度</label>
        <span id="tilesAlphaValue">0.50</span>
      </div>
      <input id="tilesAlpha" type="range" min="0.1" max="1" step="0.05" disabled>
    </div>
  </section>

  <section class="section">
    <div class="section-title">视图</div>
    <div class="button-grid">
      <button id="orthoView" type="button">完整航测区域</button>
      <button id="modelView" type="button" disabled>聚焦模型</button>
    </div>
    <a class="back-link" href="./#/" target="_top">返回平台</a>
  </section>

  <section id="debugSection" class="section" hidden>
    <div class="section-title">Debug</div>
    <div id="debugInfo"></div>
  </section>

  <div id="status" class="loading" role="status">正在加载正式 GIS 资源...</div>
</aside>

<script>
(async function () {
  "use strict";

  // 固定配置只保存不会在页面运行过程中变化的参数。
  const GIS_VIEWER_CONFIG = Object.freeze({
    basemap: Object.freeze({
      enabled: false
    }),
    ortho: Object.freeze({
      url: "/gis/raster/1/{z}/{x}/{y}.png",
      // 示例范围；正式部署时替换为项目成果的 WGS84 边界。
      bounds: Object.freeze([116.35, 39.85, 116.45, 39.95]),
      minimumLevel: 14,
      maximumLevel: 22,
      defaultAlpha: 1.0
    }),
    tiles3d: Object.freeze({
      url: "/gis/3d/2/tileset.json",
      maximumScreenSpaceError: 2,
      defaultAlpha: 0.5,
      modelModeAlpha: 1.0
    }),
    camera: Object.freeze({
      modelHeadingDegrees: 25,
      modelPitchDegrees: -35
    }),
    scene: Object.freeze({
      backgroundColor: "#0f172a"
    })
  });

  // 运行时状态与固定配置分离，图层引用、显隐和当前模式只在此处维护。
  const viewerState = {
    mode: "ortho",
    orthoLayer: null,
    tileset: null,
    tilesetLoaded: false,
    orthoVisible: true,
    tilesVisible: false,
    orthoAlpha: GIS_VIEWER_CONFIG.ortho.defaultAlpha,
    tilesAlpha: GIS_VIEWER_CONFIG.tiles3d.defaultAlpha
  };

  const controls = {
    orthoMode: document.getElementById("orthoMode"),
    modelMode: document.getElementById("modelMode"),
    orthoVisible: document.getElementById("orthoVisible"),
    tilesVisible: document.getElementById("tilesVisible"),
    orthoAlpha: document.getElementById("orthoAlpha"),
    tilesAlpha: document.getElementById("tilesAlpha"),
    orthoAlphaValue: document.getElementById("orthoAlphaValue"),
    tilesAlphaValue: document.getElementById("tilesAlphaValue"),
    orthoView: document.getElementById("orthoView"),
    modelView: document.getElementById("modelView"),
    status: document.getElementById("status"),
    debugSection: document.getElementById("debugSection"),
    debugInfo: document.getElementById("debugInfo")
  };

  const bounds = GIS_VIEWER_CONFIG.ortho.bounds;
  const orthoRectangle = Cesium.Rectangle.fromDegrees(bounds[0], bounds[1], bounds[2], bounds[3]);
  const debugEnabled = new URLSearchParams(window.location.search).get("debug") === "true";

  const viewer = new Cesium.Viewer("cesiumContainer", {
    baseLayer: GIS_VIEWER_CONFIG.basemap.enabled ? undefined : false,
    terrainProvider: new Cesium.EllipsoidTerrainProvider(),
    animation: false,
    timeline: false,
    geocoder: false,
    homeButton: false,
    sceneModePicker: false,
    baseLayerPicker: false
  });

  // 不接入公共底图，仅调整无影像区域的背景颜色。
  const backgroundColor = Cesium.Color.fromCssColorString(GIS_VIEWER_CONFIG.scene.backgroundColor);
  viewer.scene.backgroundColor = backgroundColor;
  viewer.scene.globe.baseColor = backgroundColor;
  if (viewer.scene.skyBox) {
    viewer.scene.skyBox.show = false;
  }
  viewer.scene.skyAtmosphere.show = false;
  viewer.scene.sun.show = false;
  viewer.scene.moon.show = false;

  // 正式正射继续通过 COG + TiTiler 动态 XYZ 加载。
  const orthoProvider = new Cesium.UrlTemplateImageryProvider({
    url: GIS_VIEWER_CONFIG.ortho.url,
    rectangle: orthoRectangle,
    minimumLevel: GIS_VIEWER_CONFIG.ortho.minimumLevel,
    maximumLevel: GIS_VIEWER_CONFIG.ortho.maximumLevel,
    tilingScheme: new Cesium.WebMercatorTilingScheme(),
    enablePickFeatures: false
  });
  viewerState.orthoLayer = viewer.imageryLayers.addImageryProvider(orthoProvider);

  function setStatus(message, type) {
    controls.status.className = type || "";
    controls.status.innerText = message;
  }

  function setMode(mode) {
    viewerState.mode = mode;
    controls.orthoMode.classList.toggle("active", mode === "ortho");
    controls.modelMode.classList.toggle("active", mode === "model");
    controls.orthoMode.setAttribute("aria-pressed", String(mode === "ortho"));
    controls.modelMode.setAttribute("aria-pressed", String(mode === "model"));
  }

  function syncControls() {
    controls.orthoVisible.checked = viewerState.orthoVisible;
    controls.tilesVisible.checked = viewerState.tilesVisible;
    controls.orthoAlpha.value = String(viewerState.orthoAlpha);
    controls.tilesAlpha.value = String(viewerState.tilesAlpha);
    controls.orthoAlphaValue.innerText = viewerState.orthoAlpha.toFixed(2);
    controls.tilesAlphaValue.innerText = viewerState.tilesAlpha.toFixed(2);
  }

  function setOrthoVisible(visible) {
    viewerState.orthoVisible = visible;
    viewerState.orthoLayer.show = visible;
  }

  function setTilesVisible(visible) {
    viewerState.tilesVisible = visible;
    if (viewerState.tileset) {
      viewerState.tileset.show = visible;
    }
  }

  function setOrthoAlpha(alpha) {
    viewerState.orthoAlpha = alpha;
    viewerState.orthoLayer.alpha = alpha;
  }

  function setTilesAlpha(alpha) {
    viewerState.tilesAlpha = alpha;
    if (!viewerState.tileset) {
      return;
    }
    // 保留已验证的 3D Tiles 透明度实现，不使用不存在的 tileset.alpha。
    viewerState.tileset.style = new Cesium.Cesium3DTileStyle({
      color: `color("white", ${alpha})`
    });
  }

  function focusOrtho() {
    // Rectangle 目标由 Cesium 按当前画布比例自动计算视距。
    return viewer.camera.flyTo({
      destination: orthoRectangle,
      duration: 0.6
    });
  }

  function focusModel() {
    if (!viewerState.tilesetLoaded || !viewerState.tileset) {
      setStatus("实景三维仍在加载，请稍后重试。", "loading");
      return Promise.resolve(false);
    }

    const offset = new Cesium.HeadingPitchRange(
      Cesium.Math.toRadians(GIS_VIEWER_CONFIG.camera.modelHeadingDegrees),
      Cesium.Math.toRadians(GIS_VIEWER_CONFIG.camera.modelPitchDegrees),
      0
    );
    return viewer.zoomTo(viewerState.tileset, offset);
  }

  function applyOrthoMode() {
    setOrthoVisible(true);
    setTilesVisible(false);
    setOrthoAlpha(GIS_VIEWER_CONFIG.ortho.defaultAlpha);
    setMode("ortho");
    syncControls();
    focusOrtho();
    setStatus("已切换到正射模式。", "");
  }

  function applyModelMode() {
    if (!viewerState.tilesetLoaded) {
      setStatus("实景三维仍在加载，请稍后重试。", "loading");
      return;
    }

    setOrthoVisible(false);
    setTilesVisible(true);
    setTilesAlpha(GIS_VIEWER_CONFIG.tiles3d.modelModeAlpha);
    setMode("model");
    syncControls();
    focusModel();
    setStatus("已切换到三维模式。", "");
  }

  function markAdvancedControl() {
    setMode("custom");
  }

  controls.orthoMode.addEventListener("click", applyOrthoMode);
  controls.modelMode.addEventListener("click", applyModelMode);

  controls.orthoVisible.addEventListener("change", function () {
    setOrthoVisible(this.checked);
    markAdvancedControl();
    syncControls();
  });

  controls.tilesVisible.addEventListener("change", function () {
    setTilesVisible(this.checked);
    markAdvancedControl();
    syncControls();
  });

  controls.orthoAlpha.addEventListener("input", function () {
    setOrthoAlpha(Number(this.value));
    markAdvancedControl();
    syncControls();
  });

  controls.tilesAlpha.addEventListener("input", function () {
    setTilesAlpha(Number(this.value));
    markAdvancedControl();
    syncControls();
  });

  controls.orthoView.addEventListener("click", function () {
    if (!viewerState.orthoVisible) {
      setOrthoVisible(true);
      markAdvancedControl();
      syncControls();
    }
    focusOrtho();
  });

  controls.modelView.addEventListener("click", function () {
    if (!viewerState.tilesetLoaded) {
      focusModel();
      return;
    }
    if (!viewerState.tilesVisible) {
      setTilesVisible(true);
      markAdvancedControl();
      syncControls();
    }
    focusModel();
  });

  if (debugEnabled) {
    controls.debugSection.hidden = false;
    controls.debugInfo.innerHTML =
      "bounds = [" + bounds.map(function (value) { return value.toFixed(8); }).join(", ") + "]<br>" +
      "zoom = " + GIS_VIEWER_CONFIG.ortho.minimumLevel + " - " + GIS_VIEWER_CONFIG.ortho.maximumLevel + "<br>" +
      "raster = " + GIS_VIEWER_CONFIG.ortho.url + "<br>" +
      "3D Tiles = 8 Block<br>" +
      "tileset = " + GIS_VIEWER_CONFIG.tiles3d.url + "<br>" +
      "basemap.enabled = " + GIS_VIEWER_CONFIG.basemap.enabled;
  }

  setOrthoVisible(viewerState.orthoVisible);
  setOrthoAlpha(viewerState.orthoAlpha);
  setMode(viewerState.mode);
  syncControls();
  focusOrtho();

  try {
    // 使用与正式 Layer API 一致的 3D Tiles 入口。
    viewerState.tileset = await Cesium.Cesium3DTileset.fromUrl(GIS_VIEWER_CONFIG.tiles3d.url);
    viewer.scene.primitives.add(viewerState.tileset);
    viewerState.tileset.maximumScreenSpaceError = GIS_VIEWER_CONFIG.tiles3d.maximumScreenSpaceError;
    viewerState.tilesetLoaded = true;
    setTilesVisible(viewerState.tilesVisible);
    setTilesAlpha(viewerState.tilesAlpha);

    controls.modelMode.disabled = false;
    controls.tilesVisible.disabled = false;
    controls.tilesAlpha.disabled = false;
    controls.modelView.disabled = false;
    syncControls();
    setStatus("正射影像与实景三维资源已加载。", "");
  } catch (error) {
    setStatus("正射影像可继续查看；实景三维加载失败，请检查网络请求。", "error");
    console.error(error);
  }
})();
</script>
</body>
</html>
