services:
  titiler:
    image: ghcr.io/developmentseed/titiler:2.2.1@sha256:bf753ccf0fe0f231bc51a0ddbaebf7c0c82253a26db8ab25d1c30ea417e704ff
    container_name: dongming-gis-titiler
    restart: unless-stopped
    command:
      - uvicorn
      - titiler.application.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
    ports:
      - "127.0.0.1:18081:8000"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
      AWS_REGION: ${MINIO_REGION:-us-east-1}
      AWS_S3_ENDPOINT: ${MINIO_S3_ENDPOINT:?MINIO_S3_ENDPOINT must be set}
      AWS_HTTPS: "NO"
      AWS_VIRTUAL_HOSTING: "FALSE"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.tiff
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      GDAL_HTTP_MULTIRANGE: "YES"
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: "YES"
      GDAL_CACHEMAX: "512"
      VSI_CACHE: "TRUE"
      VSI_CACHE_SIZE: "50000000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true

  nginx:
    image: ghcr.io/nginx/nginx-unprivileged:1.30.4-alpine
    container_name: dongming-gis-publisher
    restart: unless-stopped
    network_mode: host
    user: "${GIS_UID:-1000}:${GIS_GID:-1000}"
    depends_on:
      titiler:
        condition: service_healthy
    volumes:
      - ../nginx/gis-publishing.conf:/etc/nginx/conf.d/default.conf:ro
      - ${GIS_STATIC_ROOT:?GIS_STATIC_ROOT must be set}:/srv/gis-poc:ro
      - ${GIS_CACHE_ROOT:?GIS_CACHE_ROOT must be set}:/var/cache/nginx
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:18082/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
